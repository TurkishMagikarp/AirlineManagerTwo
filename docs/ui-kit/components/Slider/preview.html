<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>Slider</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage am-stage--col">
  <div class="am-row" style="max-width:420px"><span class="am-label" style="min-width:120px">Lautstärke</span><div class="am-slider" role="slider" tabindex="0" aria-label="Lautstärke" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="--p:60%"><i></i><b></b></div><span class="am-num" style="min-width:48px;text-align:right">60 %</span></div>
  <div class="am-row" style="max-width:420px"><span class="am-label" style="min-width:120px">UI-Skalierung</span><div class="am-slider" role="slider" tabindex="0" aria-label="UI-Skalierung" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="--p:100%"><i></i><b></b></div><span class="am-num" style="min-width:48px;text-align:right">100 %</span></div>
</div>
</body>
</html>
