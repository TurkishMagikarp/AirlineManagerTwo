<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>AircraftCard</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage">
  <article class="am-aircraft"><div><h3>ATR 72-600</h3><span class="am-caption">Turboprop · Regional</span></div>
    <dl class="am-facts"><dt>Sitze</dt><dd>70</dd><dt>Reichweite</dt><dd>1.528 km</dd><dt>Reisegeschwindigkeit</dt><dd>510 km/h</dd><dt>Besatzung</dt><dd>2 + 2</dd></dl>

  <article class="am-aircraft"><div><h3>Airbus A220-300</h3><span class="am-caption">Jet · Kurz- und Mittelstrecke</span></div>
    <dl class="am-facts"><dt>Sitze</dt><dd>145</dd><dt>Reichweite</dt><dd>6.300 km</dd><dt>Reisegeschwindigkeit</dt><dd>830 km/h</dd><dt>Besatzung</dt><dd>2 + 4</dd></dl>
    <div class="am-aircraft__price">81.000.000 <small>EUR</small></div><button class="am-btn" disabled>Kaufen</button><span class="am-help am-help--error">Das Guthaben reicht nicht aus.</span></article>
</div>

</html>
