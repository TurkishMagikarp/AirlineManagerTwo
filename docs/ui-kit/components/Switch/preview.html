<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>Switch</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage" style="gap:var(--space-5)">
  <div class="am-row"><button class="am-switch" role="switch" aria-checked="true"></button><span class="am-state">Ein</span></div>
  <div class="am-row"><button class="am-switch" role="switch" aria-checked="false"></button><span class="am-state">Aus</span></div>
  <div class="am-row"><button class="am-switch is-focus" role="switch" aria-checked="true"></button><span class="am-state">Ein</span></div>
  <div class="am-row"><button class="am-switch" role="switch" aria-checked="false" disabled></button><span class="am-state">Aus</span></div>
</div>
</body>
</html>
