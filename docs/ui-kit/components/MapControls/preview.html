<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>MapControls</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage" style="background:var(--map-water);gap:var(--space-5);align-items:flex-start"><div class="am-layers" role="group" aria-label="Kartenebenen">
  <span class="am-label">Ebenen</span>
  <button class="am-check" role="checkbox" aria-checked="true"><i></i><span class="am-swatch"></span>Eigene Routen</button>
  <button class="am-check" role="checkbox" aria-checked="true"><i></i><span class="am-swatch am-swatch--rival"></span>Konkurrenz</button>
  <button class="am-check" role="checkbox" aria-checked="false"><i></i><span class="am-swatch am-swatch--demand"></span>Nachfrage</button>
</div><div class="am-mapctl" role="group" aria-label="Zoom"><button aria-label="Vergrößern">+</button><button aria-label="Verkleinern">−</button><button aria-label="Auf Basis zentrieren">◎</button></div><div class="am-scale" role="img" aria-label="Maßstab: 200 Kilometer">200 km</div></div>
</body>
</html>
