<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>SettingsRow</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage am-stage--col">
  <section class="am-panel"><div class="am-panel__body" style="gap:0">
    <div class="am-setting"><div class="am-setting__text"><b>Sprache</b><span>Gilt sofort, ohne Neustart.</span></div><div class="am-setting__ctl"><div class="am-seg" role="group" aria-label="Sprache"><button aria-pressed="true">Deutsch</button><button aria-pressed="false">English</button></div></div></div>
    <div class="am-setting"><div class="am-setting__text"><b>Automatisch speichern</b><span>Speichert zu Beginn jedes Spieltags.</span></div><div class="am-setting__ctl"><button class="am-switch" role="switch" aria-checked="true"></button><span class="am-state">Ein</span></div></div>
    <div class="am-setting"><div class="am-setting__text"><b>Pause</b><span>Hält die Simulation an oder setzt sie fort.</span></div><div class="am-setting__ctl"><span class="am-keys"><kbd class="am-key">Leertaste</kbd></span><button class="am-btn am-btn--sm">Ändern</button></div></div>
  </div></section>
</div>
</body>
</html>
