<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>Button</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage am-stage--col">
  <div class="am-row">
    <button class="am-btn am-btn--primary">Flugzeug kaufen</button>
    <button class="am-btn">Flugplan bearbeiten</button>
    <button class="am-btn am-btn--danger">Route löschen</button>
    <button class="am-btn am-btn--ghost">Abbrechen</button>
    <button class="am-btn" disabled>Kaufen</button>
  </div>
  <div class="am-row">
    <button class="am-btn am-btn--primary is-hover">Hover</button>
    <button class="am-btn is-hover">Hover</button>
    <button class="am-btn is-focus">Fokus</button>
    <button class="am-btn is-pressed">Gedrückt</button>
    <button class="am-btn am-btn--sm">Details</button>
    <button class="am-btn am-btn--danger-solid">Verkaufen</button>
  </div>
</div>
</body>
</html>
