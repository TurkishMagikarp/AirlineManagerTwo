<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>RouteCard</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage" style="background:var(--map-water)"><aside class="am-mapcard" aria-label="Route EDDF–EDDH">

  <div class="am-mapcard__actions"><button class="am-btn am-btn--sm">Flugplan bearbeiten</button></div>
</aside></div>
</body>
</html>
