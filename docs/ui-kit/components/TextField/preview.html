<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>TextField</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage">
  <div class="am-field"><label class="am-label" for="price">Ticketpreis</label><div class="am-input am-input--num"><input id="price" value="71" inputmode="numeric"><span class="am-input__unit">EUR</span></div><span class="am-help">Empfohlen für EDDF–EDDM: 64–82 EUR</span></div>
  <div class="am-field"><label class="am-label" for="name">Name der Airline</label><div class="am-input is-focus"><input id="name" placeholder="z. B. Nordwind Regional"></div><span class="am-help">Erscheint auf Karte und Flugplänen.</span></div>
  <div class="am-field"><label class="am-label" for="bad">Ticketpreis</label><div class="am-input am-input--num is-error"><input id="bad" value="0" aria-invalid="true"><span class="am-input__unit">EUR</span></div><span class="am-help am-help--error">Der Preis muss mindestens 1 EUR betragen.</span></div>
  <div class="am-field"><label class="am-label" for="off">Landungen pro Tag</label><div class="am-input am-input--num is-disabled"><input id="off" value="8" disabled></div><span class="am-help">Erst nach Zuweisung eines Flugzeugs änderbar.</span></div>
</div>
</body>
</html>
