<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>ClockBar</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<header class="am-clockbar">
  <span class="am-flap" role="img" aria-label="SA 14.11.2026"><span>S</span><span>A</span><i></i><span>1</span><span>4</span><span>.</span><span>1</span><span>1</span><span>.</span><span>2</span><span>0</span><span>2</span><span>6</span></span>
  <span class="am-flap" role="img" aria-label="08:42"><span>0</span><span>8</span><span>:</span><span>4</span><span>2</span></span>
  <div class="am-seg" role="group" aria-label="Spielgeschwindigkeit">
    <button aria-pressed="false">Pause</button><button aria-pressed="false">1×</button><button aria-pressed="true">4×</button><button aria-pressed="false">16×</button>
  </div>
  <span class="am-grow"></span>
  <div class="am-cash"><span class="am-label">Guthaben</span><b>1.284.500 EUR</b></div>
  <button class="am-btn">Speichern</button>
  <button class="am-btn am-btn--ghost">Laden</button>
</header>
</body>
</html>
