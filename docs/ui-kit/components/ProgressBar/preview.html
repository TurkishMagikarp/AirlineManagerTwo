<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>ProgressBar</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage">
  <div class="am-col am-grow" style="min-width:260px;gap:var(--space-4)">
    <div class="am-col"><div class="am-row" style="justify-content:space-between"><span class="am-label">A-Check D-ANFC</span><span class="am-num">62 %</span></div><div class="am-progress" style="--p:62%"><i></i></div></div>
    <div class="am-col"><div class="am-row" style="justify-content:space-between"><span class="am-label">Auslastung EDDF–EDDM</span><span class="am-num am-go">81 %</span></div><div class="am-progress am-progress--go" style="--p:81%"><i></i></div></div>
    <div class="am-col"><div class="am-row" style="justify-content:space-between"><span class="am-label">Personalreserve</span><span class="am-num am-stop">9 %</span></div><div class="am-progress am-progress--stop" style="--p:9%"><i></i></div></div>
  </div>
  <div class="am-grow" style="min-width:320px"><div class="am-col" style="gap:var(--space-3)">
  <div class="am-leg"><span>NW 204 · EDDF</span><span class="am-leg__track" style="--p:64%"><i></i><b></b></span><span>EDDM · 09:05</span></div>
  <div class="am-leg"><span>NW 311 · EDDH</span><span class="am-leg__track" style="--p:22%"><i></i><b></b></span><span>EDDF · 09:48</span></div>
  <div class="am-leg am-muted"><span>NW 118 · EDDF</span><span class="am-leg__track" style="--p:0%"><i></i></span><span>EDDH · ab 10:15</span></div>
</div></div>
</div>
</body>
</html>
