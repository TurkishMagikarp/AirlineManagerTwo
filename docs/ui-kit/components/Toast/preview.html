<!doctype html>
<html lang="de" data-theme="night">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>Toast</title><style>html,body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="am-stage am-stage--col" style="align-items:flex-start">
  <div class="am-toast" role="status"><span class="am-chip am-chip--go">Gespeichert</span><p>Spielstand „Nordwind Regional“ gesichert.</p><button class="am-btn am-btn--ghost am-btn--sm">Schließen</button></div>
  <div class="am-toast" role="alert"><span class="am-chip am-chip--stop">Fehler</span><p>Speichern fehlgeschlagen: Der Datenträger ist voll.</p><button class="am-btn am-btn--sm">Erneut versuchen</button></div>
</div>
</body>
</html>
