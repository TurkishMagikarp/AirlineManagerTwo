name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: python -m unittest discover -s tests/automation
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: python tools/ci_godot.py
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - run: bash tools/godot_check.sh tests
      - run: bash tools/godot_check.sh shots "$RUNNER_TEMP/airline-shots"
      - uses: actions/upload-artifact@v4
        with:
          name: godot-screenshots
          path: ${{ runner.temp }}/airline-shots/*.png
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: python tools/ci_godot.py
      - name: Startup
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & .\START.bat --headless --quit-after 10 2>&1 | Tee-Object -Variable startup
            if ($LASTEXITCODE -eq 0 -and -not ($startup -match 'SCRIPT ERROR:|Parse Error:')) { return }
            # On a cold Windows runner Godot may exit zero while reimporting
            # assets. Retry only the resulting missing-import startup error.
            if (-not ($startup -match 'Could not preload resource file')) { throw "Startup failed" }
            Write-Warning "Godot asset import did not complete on attempt $attempt; retrying."
          }
          throw "Startup failed after Godot asset import retries"
      - name: Multi-process save/restart
        run: |
          & pwsh -NoProfile -File tests/run_save_restart_test.ps1 -Godot $env:AIRLINE_GODOT
          if ($LASTEXITCODE -ne 0) { throw "Save/restart failed: $LASTEXITCODE" }
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: python3 tools/ci_godot.py
      - run: command -v gtimeout || brew install coreutils
      - name: Native build and launch
        run: bash tools/godot_check.sh test frame
